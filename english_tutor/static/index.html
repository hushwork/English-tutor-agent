<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1628">
<title>English Tutor</title>
<style>
  :root {
    --bg: #0a1628;
    --surface: #132238;
    --surface2: #1a3050;
    --text: #d4e4f7;
    --dim: #6a8aaa;
    --accent: #3bcc8e;
    --accent2: #4da6ff;
    --warn: #f0c040;
    --danger: #e0556a;
    --magenta: #c084fc;
    --radius: 10px;
    --safe-bottom: env(safe-area-inset-bottom, 8px);
  }
  * { box-sizing:border-box; margin:0; padding:0 }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100dvh; display: flex; flex-direction: column;
    max-width: 520px; margin: 0 auto;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Header ── */
  header {
    padding: 12px 16px 8px;
    text-align: center;
    border-bottom: 1px solid var(--surface2);
    flex-shrink: 0;
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px }
  header h1 span { color: var(--accent) }
  header .sub { font-size: 0.7rem; color: var(--dim); margin-top: 2px }

  /* ── Identity card ── */
  #identity-card {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: var(--surface); border-bottom: 1px solid var(--surface2);
    flex-shrink: 0; cursor: pointer; transition: background 0.2s;
  }
  #identity-card:active { background: var(--surface2) }
  #id-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; color: #fff; flex-shrink: 0;
  }
  #id-info { flex: 1; min-width: 0 }
  #id-name { font-weight: 600; font-size: 0.9rem; color: var(--text) }
  #id-goal { font-size: 0.7rem; color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  #id-switch-hint { font-size: 0.65rem; color: var(--dim); opacity: 0.5; flex-shrink: 0 }
  /* Switch animation */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(-8px) }
    to { opacity: 1; transform: translateY(0) }
  }
  .switch-anim { animation: fadeSlideIn 0.35s ease-out }
  /* User picker modal */
  #user-picker-modal .user-pick-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: var(--radius); cursor: pointer; transition: background 0.15s;
    border: 1px solid transparent;
  }
  #user-picker-modal .user-pick-row:hover, #user-picker-modal .user-pick-row:active { background: var(--surface2) }
  #user-picker-modal .user-pick-row.active { border-color: var(--accent); background: rgba(59,204,142,0.1) }
  .user-pick-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.8rem; color: #fff; flex-shrink: 0;
  }
  .user-pick-name { font-weight: 600; font-size: 0.88rem }
  .user-pick-goal { font-size: 0.7rem; color: var(--dim) }
  .user-pick-new {
    text-align: center; padding: 12px; color: var(--accent);
    font-weight: 600; border: 1px dashed var(--surface2); border-radius: var(--radius);
    cursor: pointer; margin-top: 8px; font-size: 0.85rem;
  }
  /* Profile modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 100; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex }
  .modal {
    background: var(--surface); border-radius: var(--radius); padding: 20px;
    width: 90%; max-width: 400px; border: 1px solid var(--surface2);
  }
  .modal h3 { font-size: 1rem; margin-bottom: 12px; color: var(--accent) }
  .modal label { display: block; font-size: 0.78rem; color: var(--dim); margin: 8px 0 4px }
  .modal input, .modal select {
    width: 100%; background: var(--surface2); color: var(--text);
    border: 1px solid var(--surface2); padding: 8px 12px; border-radius: var(--radius);
    font-size: 0.85rem; outline: none;
  }
  .modal .btn-row { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end }

  /* ── Views ── */
  .view { display: none; flex: 1; flex-direction: column; overflow: hidden; height: 100% }
  .view.active { display: flex }

  /* ── Chat ── */
  #chat-messages {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.45; font-size: 0.92rem; word-break: break-word }
  .msg.user { background: var(--accent2); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px }
  .msg.assistant { background: var(--surface); color: var(--text); align-self: flex-start; border-bottom-left-radius: 3px }
  .msg.assistant.streaming { border-left: 2px solid var(--accent) }
  .msg .label { font-size: 0.65rem; opacity: 0.6; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.5px }
  #chat-input-wrap {
    display: flex; gap: 8px; padding: 8px 12px calc(8px + var(--safe-bottom));
    border-top: 1px solid var(--surface2); flex-shrink: 0; background: var(--bg);
  }
  #chat-input {
    flex: 1; background: var(--surface); border: 1px solid var(--surface2);
    color: var(--text); padding: 10px 14px; border-radius: 22px; font-size: 0.9rem;
    outline: none; transition: border-color 0.2s;
  }
  #chat-input:focus { border-color: var(--accent2) }
  .btn {
    background: var(--accent2); color: #fff; border: none; border-radius: 22px;
    padding: 10px 18px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    white-space: nowrap; transition: opacity 0.2s;
  }
  .btn:active { opacity: 0.7 }
  .btn.small { padding: 6px 14px; font-size: 0.78rem; border-radius: 16px }
  .btn.ghost { background: transparent; border: 1px solid var(--surface2); color: var(--dim) }
  .btn.accent { background: var(--accent); color: #000 }

  /* ── Immerse ── */
  #immerse-view { padding: 12px; gap: 12px; overflow-y: auto }
  .immerse-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
  .immerse-controls select {
    background: var(--surface); color: var(--text); border: 1px solid var(--surface2);
    padding: 8px 12px; border-radius: var(--radius); font-size: 0.85rem; outline: none;
  }
  .pass-indicator {
    display: flex; gap: 6px; justify-content: center; margin: 8px 0;
  }
  .pass-dot {
    width: 12px; height: 12px; border-radius: 50%; background: var(--surface2);
    transition: background 0.3s;
  }
  .pass-dot.active { background: var(--accent) }
  .pass-dot.done { background: var(--accent2) }
  .pass-panel {
    background: var(--surface); border-radius: var(--radius); padding: 16px;
    text-align: center; border: 1px solid var(--surface2);
  }
  .pass-panel h3 { font-size: 1rem; margin-bottom: 6px }
  .pass-panel p { font-size: 0.8rem; color: var(--dim); line-height: 1.5 }
  .passage-text {
    background: var(--surface); border-radius: var(--radius); padding: 16px;
    font-size: 0.95rem; line-height: 1.7; display: none; border: 1px solid var(--surface2);
    white-space: pre-wrap;
  }
  .passage-text.visible { display: block }
  .key-words {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;
  }
  .key-word {
    background: var(--surface); color: var(--accent); padding: 4px 12px;
    border-radius: 14px; font-size: 0.82rem; font-weight: 600;
  }
  .closing-thought { font-style: italic; color: var(--dim); text-align: center; margin-top: 8px; font-size: 0.88rem }
  audio { width: 100%; margin: 8px 0; border-radius: var(--radius) }
  .immers-pass-btns { display: flex; gap: 8px; justify-content: center }

  /* ── Stats ── */
  #stats-view { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px }
  .stat-card {
    background: var(--surface); border-radius: var(--radius); padding: 14px;
    border: 1px solid var(--surface2);
  }
  .stat-card h3 { font-size: 0.85rem; color: var(--accent); margin-bottom: 8px }
  .stat-row { display: flex; gap: 8px; flex-wrap: wrap }
  .stat-chip {
    background: var(--surface2); padding: 6px 14px; border-radius: 16px;
    font-size: 0.8rem;
  }
  .stat-chip .num { font-weight: 700; color: var(--accent) }
  .error-bar {
    display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 0.8rem;
  }
  .error-bar .fill {
    height: 8px; background: var(--accent2); border-radius: 4px; transition: width 0.4s;
  }

  /* ── Tabs ── */
  nav {
    display: flex; border-top: 1px solid var(--surface2); flex-shrink: 0;
    padding-bottom: var(--safe-bottom); background: var(--bg);
  }
  nav button {
    flex: 1; background: none; border: none; color: var(--dim);
    padding: 10px 6px; font-size: 0.72rem; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    transition: color 0.2s;
  }
  nav button .icon { font-size: 1.2rem }
  nav button.active { color: var(--accent) }

  /* ── Spinner ── */
  .spinner {
    display: inline-block; width: 16px; height: 16px; border: 2px solid var(--surface2);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite;
    margin-right: 6px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ── Empty state ── */
  .empty { text-align: center; color: var(--dim); padding: 40px 20px; font-size: 0.88rem; line-height: 1.6 }
  .empty .icon { font-size: 2.5rem; display: block; margin-bottom: 12px }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px }
</style>
</head>
<body>

<header>
  <h1>🌊 English <span>Tutor</span></h1>
  <div class="sub">Phase-1 Pretraining Input</div>
</header>

<!-- Identity card -->
<div id="identity-card" onclick="showUserPicker()">
  <div id="id-avatar">?</div>
  <div id="id-info">
    <div id="id-name">Loading...</div>
    <div id="id-goal"></div>
  </div>
  <div id="id-switch-hint">▾ Switch</div>
</div>

<!-- User picker modal -->
<div class="modal-overlay" id="user-picker-modal">
  <div class="modal">
    <h3>👥 Who's Learning?</h3>
    <div id="user-picker-list"></div>
    <div class="user-pick-new" onclick="showNewUserModal(); hideUserPicker()">+ Create New Learner</div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn small ghost" onclick="hideUserPicker()">Close</button>
    </div>
  </div>
</div>

<!-- New user modal -->
<div class="modal-overlay" id="new-user-modal">
  <div class="modal">
    <h3>🎓 New Learner</h3>
    <label>Name</label>
    <input id="nu-name" type="text" placeholder="Your name">
    <label>Target CEFR Level</label>
    <select id="nu-cefr">
      <option value="A1">A1 — Beginner</option>
      <option value="A2">A2 — Elementary</option>
      <option value="B1" selected>B1 — Intermediate</option>
      <option value="B2">B2 — Upper Intermediate</option>
      <option value="C1">C1 — Advanced</option>
      <option value="C2">C2 — Mastery</option>
    </select>
    <label>Focus Areas</label>
    <input id="nu-focus" type="text" placeholder="speaking, reading" value="speaking, reading">
    <label>Daily Goal (minutes)</label>
    <input id="nu-goal" type="number" min="5" max="120" value="20">
    <label>Face Recognition</label>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn small" onclick="captureFace()" id="nu-face-btn" type="button">📷 Capture Face</button>
      <span id="nu-face-status" style="font-size:0.75rem;color:var(--dim)"></span>
    </div>
    <div class="btn-row">
      <button class="btn small ghost" onclick="hideNewUserModal()">Cancel</button>
      <button class="btn small accent" onclick="createUser()">Create</button>
    </div>
  </div>
</div>

<!-- Chat View -->
<div id="chat-view" class="view active">
  <div id="chat-messages"></div>
  <div id="chat-input-wrap">
    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off">
    <button class="btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<!-- Immerse View -->
<div id="immerse-view" class="view">
  <div class="immerse-controls">
    <select id="immerse-difficulty">
      <option value="easy">A2 — Easy</option>
      <option value="medium" selected>B1 — Medium</option>
      <option value="hard">B2 — Hard</option>
    </select>
    <select id="immerse-type">
      <option value="">🎲 Random</option>
      <option value="daily_scene">🌅 Daily Scene</option>
      <option value="mini_story">📖 Mini Story</option>
      <option value="place_description">🏞️ Place</option>
      <option value="dialogue">💬 Dialogue</option>
      <option value="observation">🔍 Observation</option>
    </select>
    <input id="immerse-topic" type="text" placeholder="Topic (optional)" style="flex:1;min-width:100px;background:var(--surface);color:var(--text);border:1px solid var(--surface2);padding:8px 12px;border-radius:var(--radius);font-size:0.85rem;outline:none">
  </div>
  <button class="btn accent" onclick="generateImmersion()" style="align-self:center">✨ Generate Passage</button>

  <div id="immerse-player" style="display:none">
    <div class="pass-indicator">
      <div class="pass-dot" id="pass-dot-1"></div>
      <div class="pass-dot" id="pass-dot-2"></div>
      <div class="pass-dot" id="pass-dot-3"></div>
    </div>
    <div class="pass-panel" id="pass-panel"></div>
    <div id="passage-text" class="passage-text"></div>
    <audio id="immerse-audio" controls style="display:none"></audio>
    <div class="immers-pass-btns">
      <button class="btn small" onclick="prevPass()" id="btn-prev" style="display:none">◀ Back</button>
      <button class="btn small accent" onclick="nextPass()" id="btn-next">Next ▶</button>
    </div>
    <div id="key-words-wrap" class="key-words" style="display:none"></div>
    <div id="closing-thought" class="closing-thought" style="display:none"></div>
  </div>
</div>

<!-- Stats View -->
<div id="stats-view" class="view">
  <div id="stats-content"></div>
</div>

<!-- Tab bar -->
<nav>
  <button class="active" onclick="switchTab('chat')">
    <span class="icon">💬</span> Chat
  </button>
  <button onclick="switchTab('immerse')">
    <span class="icon">🌊</span> Immerse
  </button>
  <button onclick="switchTab('stats')">
    <span class="icon">📊</span> Stats
  </button>
</nav>

<script>
// ── State ──
let currentPass = 0;  // 0=not started, 1,2,3
let immersionData = null;
let audioBlobUrl = null;

// ── Tab switching ──
function switchTab(tab) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(tab + '-view').classList.add('active');
  event.target.closest('button').classList.add('active');
  if (tab === 'stats') loadStats();
}

// ── Chat ──
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');

chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  appendMsg('user', text);
  const streamMsg = appendMsg('assistant', '', true);

  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text}),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));
          if (data.token) {
            streamMsg.querySelector('.content').textContent += data.token;
            chatMessages.scrollTop = chatMessages.scrollHeight;
          } else if (data.error) {
            streamMsg.querySelector('.content').textContent = 'Error: ' + data.error;
          } else if (data.done) {
            streamMsg.classList.remove('streaming');
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    streamMsg.querySelector('.content').textContent = 'Connection error. Please try again.';
    streamMsg.classList.remove('streaming');
  }
}

function appendMsg(role, content, streaming = false) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (streaming ? ' streaming' : '');
  const label = role === 'assistant' ? 'Emma' : 'You';
  div.innerHTML = `<div class="label">${label}</div><div class="content">${escapeHtml(content)}</div>`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return div;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Immersion ──
async function generateImmersion() {
  const difficulty = document.getElementById('immerse-difficulty').value;
  const content_type = document.getElementById('immerse-type').value;
  const topic = document.getElementById('immerse-topic').value;

  const player = document.getElementById('immerse-player');
  player.style.display = 'none';
  currentPass = 0;

  // Show loading
  showLoading('Generating passage...');

  try {
    const resp = await fetch('/api/immerse/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({difficulty, content_type: content_type || undefined, topic: topic || undefined}),
    });
    immersionData = await resp.json();

    // Generate audio
    showLoading('Generating audio...');
    const audioResp = await fetch('/api/speak', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: immersionData.passage}),
    });
    const audioData = await audioResp.json();
    immersionData.audio_url = audioData.url;

    // Show player
    player.style.display = 'block';
    currentPass = 1;
    updatePassUI();

    hideLoading();
    player.scrollIntoView({behavior: 'smooth'});
  } catch(e) {
    hideLoading();
    alert('Failed to generate. Check your connection and try again.');
    console.error(e);
  }
}

function updatePassUI() {
  // Pass dots
  for (let i = 1; i <= 3; i++) {
    const dot = document.getElementById('pass-dot-' + i);
    dot.className = 'pass-dot';
    if (i < currentPass) dot.classList.add('done');
    if (i === currentPass) dot.classList.add('active');
  }

  // Pass panel text
  const panel = document.getElementById('pass-panel');
  const panels = {
    1: `<h3>👂 Pass 1/3 — Sound First</h3><p>Listen only. Don't try to understand every word.<br>Let the rhythm wash over you.<br><br>💡 Relax your shoulders. Unclench your jaw.<br>You're not being tested. You're just listening.</p>`,
    2: `<h3>👁️ Pass 2/3 — Read Along</h3><p>Now see the text while listening.<br>Connect the written words to the sounds.<br>Notice: did anything sound different than you expected?</p>`,
    3: `<h3>🧘 Pass 3/3 — Eyes Closed</h3><p>Close your eyes if you can. Just listen.<br>Your brain is building direct pathways.<br>How much more did you understand this time?</p>`,
  };
  panel.innerHTML = panels[currentPass] || '';

  // Text visibility
  const passageDiv = document.getElementById('passage-text');
  passageDiv.textContent = immersionData?.passage || '';
  passageDiv.classList.toggle('visible', currentPass === 2);

  // Audio
  const audio = document.getElementById('immerse-audio');
  if (immersionData?.audio_url) {
    audio.src = immersionData.audio_url;
    audio.style.display = 'block';
  }

  // Buttons
  document.getElementById('btn-prev').style.display = currentPass > 1 ? '' : 'none';
  const btnNext = document.getElementById('btn-next');
  if (currentPass >= 3) {
    btnNext.textContent = '✨ Reveal Key Words';
    btnNext.className = 'btn small accent';
  } else {
    btnNext.textContent = 'Next ▶';
    btnNext.className = 'btn small accent';
  }

  // Key words + closing thought (only after pass 3)
  const kwWrap = document.getElementById('key-words-wrap');
  const ct = document.getElementById('closing-thought');
  kwWrap.style.display = 'none';
  ct.style.display = 'none';
}

function nextPass() {
  if (currentPass < 3) {
    currentPass++;
    updatePassUI();
    document.getElementById('immerse-player').scrollIntoView({behavior: 'smooth'});
  } else {
    // Reveal key words
    const kwWrap = document.getElementById('key-words-wrap');
    kwWrap.innerHTML = '';
    if (immersionData?.key_words) {
      immersionData.key_words.forEach(w => {
        const span = document.createElement('span');
        span.className = 'key-word';
        span.textContent = w;
        kwWrap.appendChild(span);
      });
    }
    kwWrap.style.display = 'flex';

    const ct = document.getElementById('closing-thought');
    ct.textContent = '💭 ' + (immersionData?.closing_thought || '');
    ct.style.display = 'block';

    document.getElementById('btn-next').textContent = '🔄 New Passage';
    document.getElementById('btn-next').onclick = generateImmersion;
    document.getElementById('btn-prev').style.display = '';
  }
}

function prevPass() {
  if (currentPass > 1) {
    currentPass--;
    updatePassUI();
  }
}

// ── Stats ──
async function loadStats() {
  const container = document.getElementById('stats-content');
  container.innerHTML = '<div class="spinner"></div> Loading...';

  try {
    const resp = await fetch('/api/stats');
    const data = await resp.json();

    const html = `
      <div class="stat-card">
        <h3>📊 Activity</h3>
        <div class="stat-row">
          <div class="stat-chip"><span class="num">${data.sessions}</span> sessions</div>
          <div class="stat-chip"><span class="num">${data.messages}</span> messages</div>
        </div>
      </div>
      <div class="stat-card">
        <h3>📚 Vocabulary</h3>
        <div class="stat-row">
          <div class="stat-chip"><span class="num">${data.vocabulary_count}</span> words saved</div>
          <div class="stat-chip"><span class="num">${data.sr_total}</span> SR cards</div>
          <div class="stat-chip"><span class="num">${data.sr_learned}</span> mastered</div>
          <div class="stat-chip"><span class="num">${data.sr_due}</span> due</div>
        </div>
        ${data.vocabulary.length ? '<div style="margin-top:10px">' +
          data.vocabulary.slice(-10).map(w =>
            `<span class="key-word" style="font-size:0.75rem">${escapeHtml(w.word)}</span>`
          ).join(' ') + '</div>' : ''}
      </div>
      <div class="stat-card">
        <h3>📝 Errors (${data.error_count} total)</h3>
        ${Object.keys(data.errors).length === 0
          ? '<p style="color:var(--dim);font-size:0.82rem">No errors tracked yet!</p>'
          : Object.entries(data.errors).sort((a,b) => b[1].count - a[1].count).map(([k,v]) => {
              const maxErr = Math.max(...Object.values(data.errors).map(e => e.count));
              const pct = (v.count / maxErr * 100);
              return `<div class="error-bar">
                <span style="min-width:90px">${k.replace(/_/g,' ')}</span>
                <div class="fill" style="width:${pct}%"></div>
                <span>${v.count}x</span>
              </div>`;
            }).join('')
        }
      </div>
    `;
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = '<p style="color:var(--danger)">Failed to load stats.</p>';
  }
}

// ── Helpers ──
function showLoading(msg) {
  const panel = document.getElementById('pass-panel');
  panel.innerHTML = `<span class="spinner"></span> ${msg}`;
}

function hideLoading() {
  // panel will be overwritten by updatePassUI
}

// ── User Management ──
const AVATAR_COLORS = ['#4da6ff','#3bcc8e','#c084fc','#f0c040','#e0556a','#ff8c42','#42d9c8'];
let currentUser = null;

function avatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
}

function initials(name) {
  return name.split(/\s+/).map(w => w[0]?.toUpperCase() || '').slice(0, 2).join('');
}

function renderIdentityCard(user) {
  currentUser = user;
  document.getElementById('id-avatar').style.background = avatarColor(user.name);
  document.getElementById('id-avatar').textContent = initials(user.name);
  document.getElementById('id-name').textContent = user.name;
  const focus = (user.focus_areas || []).slice(0,3).join(', ');
  document.getElementById('id-goal').textContent = `Target: ${user.target_cefr} · ${focus || 'all'}`;
  // Animate
  const card = document.getElementById('identity-card');
  card.classList.remove('switch-anim');
  void card.offsetWidth; // reflow
  card.classList.add('switch-anim');
}

async function loadUsers() {
  try {
    const resp = await fetch('/api/users');
    const data = await resp.json();
    // Show active user in identity card
    const active = data.users.find(u => u.is_active);
    if (active) {
      renderIdentityCard(active);
    } else if (data.users.length > 0) {
      // Auto-activate first user
      await switchUser(data.users[0].user_id);
      return;
    }
    // Build user picker list
    buildUserPickerList(data.users);
    // If no users, auto-show new user modal
    if (data.users.length === 0) showNewUserModal();
  } catch(e) {
    console.error('Failed to load users:', e);
  }
}

function buildUserPickerList(users) {
  const list = document.getElementById('user-picker-list');
  list.innerHTML = '';
  users.forEach(u => {
    const row = document.createElement('div');
    row.className = 'user-pick-row' + (u.is_active ? ' active' : '');
    row.onclick = () => { hideUserPicker(); switchUser(u.user_id); };
    row.innerHTML = `
      <div class="user-pick-avatar" style="background:${avatarColor(u.name)}">${initials(u.name)}</div>
      <div>
        <div class="user-pick-name">${escapeHtml(u.name)} ${u.is_active ? '✅' : ''}</div>
        <div class="user-pick-goal">${u.target_cefr} · ${(u.focus_areas||[]).slice(0,2).join(', ')}</div>
      </div>
    `;
    list.appendChild(row);
  });
}

function showUserPicker() {
  // Refresh list before showing
  fetch('/api/users').then(r => r.json()).then(data => {
    buildUserPickerList(data.users);
    document.getElementById('user-picker-modal').classList.add('show');
  }).catch(() => {
    document.getElementById('user-picker-modal').classList.add('show');
  });
}

function hideUserPicker() {
  document.getElementById('user-picker-modal').classList.remove('show');
}

async function switchUser(userId) {
  try {
    await fetch('/api/users/switch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user_id: userId}),
    });
    // Reload to update identity card
    await loadUsers();
    // Clear chat + personalized greeting
    const msgs = document.getElementById('chat-messages');
    msgs.innerHTML = '';
    const name = currentUser?.name || 'friend';
    const cefr = currentUser?.target_cefr || 'B1';
    const focus = (currentUser?.focus_areas || ['speaking']).slice(0,2).join(' and ');
    appendMsg('assistant',
      `Welcome back, **${name}**! 👋 I'm Emma, your English tutor.\n\n` +
      `You're working toward **${cefr}** level, focusing on **${focus}**. ` +
      `Ready to practice? What would you like to talk about today?`
    );
  } catch(e) {
    console.error('Failed to switch user:', e);
  }
}

function showNewUserModal() {
  document.getElementById('new-user-modal').classList.add('show');
}

function hideNewUserModal() {
  document.getElementById('new-user-modal').classList.remove('show');
}

let faceEmbedding = null;

async function captureFace() {
  const btn = document.getElementById('nu-face-btn');
  const status = document.getElementById('nu-face-status');
  btn.disabled = true;
  btn.textContent = '📷 Capturing...';
  status.textContent = '';
  try {
    const resp = await fetch('/api/face/capture', {method:'POST'});
    if (!resp.ok) {
      const err = await resp.json();
      status.innerHTML = '<span style="color:var(--danger)">✗ ' + (err.detail || 'Failed') + '</span>';
    } else {
      const data = await resp.json();
      if (data.embedding) {
        faceEmbedding = data.embedding;
        status.innerHTML = '<span style="color:var(--accent)">✓ Face registered!</span>';
      } else {
        status.innerHTML = '<span style="color:var(--warn)">Face detected but library missing. Install face_recognition for auto-login.</span>';
      }
    }
  } catch(e) {
    status.innerHTML = '<span style="color:var(--danger)">Camera not available</span>';
  }
  btn.disabled = false;
  btn.textContent = '📷 Capture Face';
}

async function createUser() {
  const name = document.getElementById('nu-name').value.trim();
  if (!name) return alert('Please enter a name.');
  const cefr = document.getElementById('nu-cefr').value;
  const focus = document.getElementById('nu-focus').value.split(',').map(s => s.trim()).filter(Boolean);
  const goal = parseInt(document.getElementById('nu-goal').value) || 20;

  try {
    const resp = await fetch('/api/users', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, target_cefr: cefr, focus_areas: focus, daily_goal_minutes: goal, face_embedding: faceEmbedding}),
    });
    if (!resp.ok) {
      const err = await resp.json();
      return alert('Error: ' + (err.detail || 'Failed to create user'));
    }
    const user = await resp.json();
    // Switch to the new user
    await switchUser(user.user_id);
    hideNewUserModal();
    // Clear form
    document.getElementById('nu-name').value = '';
    faceEmbedding = null;
    document.getElementById('nu-face-status').textContent = '';
  } catch(e) {
    alert('Failed to create user. Check connection.');
    console.error(e);
  }
}

// ── Init ──
document.addEventListener('DOMContentLoaded', async () => {
  // Try face recognition first
  try {
    const resp = await fetch('/api/face/recognize', {method:'POST'});
    const data = await resp.json();
    if (data.recognized) {
      // Face recognized! Load users to show identity card
      await loadUsers();
      // Show personalized greeting
      const msgs = document.getElementById('chat-messages');
      msgs.innerHTML = '';
      const focus = (data.focus_areas || ['speaking']).slice(0,2).join(' and ');
      appendMsg('assistant',
        `👋 Recognized you, **${data.name}**! Welcome back!\n\n` +
        `You're working toward **${data.target_cefr}** level, focusing on **${focus}**. ` +
        `Ready to practice? What would you like to talk about today?`
      );
      return;
    }
  } catch(e) { /* ignore, fall through to normal load */ }
  // Normal load
  loadUsers();
});
</script>
