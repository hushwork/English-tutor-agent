<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- 页面同时挂在 / 和 /static/face_preview.html 两个路径下；
     Live2D 资源（含 bundle.js 内部的模型/着色器 fetch）都是相对路径，
     统一按 /static/ 解析，否则从 / 访问时全部 404、卡通形象不显示 -->
<base href="/static/">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Tutor — Live2D</title>
<style>
  body { margin:0; background:#0f1117; overflow:hidden; }
  canvas { display:block; }
  #info { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); color:#8b8fa3; font:13px sans-serif; display:flex; gap:16px; align-items:center; z-index:100; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
  .dot.on { background:#4ecf8d; }
  .dot.off { background:#ff5c6c; }
  /* 左上角导师信息；z-index 高于 startOverlay(200)，开始对话前也可点 */
  #tutorBadge { position:fixed; top:12px; left:12px; z-index:300; display:flex; align-items:center; gap:8px;
    background:rgba(20,23,32,.72); border:1px solid #2a2d3a; border-radius:999px; padding:6px 14px;
    color:#e6e8f0; font:14px sans-serif; backdrop-filter:blur(4px); }
  #tutorBadge .emoji { font-size:20px; }
  #tutorBadge .name { font-weight:600; }
  /* 字幕独立成一层：宽度固定居中，不随文本长度把整行顶来顶去 */
  #subtitle { position:fixed; bottom:48px; left:50%; transform:translateX(-50%); width:min(80vw,720px);
    text-align:center; color:#f2f3f7; font:16px/1.5 sans-serif; text-shadow:0 1px 4px rgba(0,0,0,.6);
    min-height:24px; z-index:100; pointer-events:none; transition:opacity .2s; }
  #settingsBtn { position:fixed; top:12px; right:12px; z-index:300; width:36px; height:36px; border-radius:50%;
    border:1px solid #2a2d3a; background:rgba(20,23,32,.72); color:#e6e8f0; font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); text-decoration:none; }
  #settingsBtn:hover { background:rgba(40,44,58,.85); }
  #camera { position:fixed; top:56px; right:12px; width:160px; border-radius:8px; border:2px solid #2a2d3a; opacity:0.85; z-index:100; display:none; }
  #startOverlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(15,17,23,.85); z-index:200; flex-direction:column; gap:12px; }
  #startOverlay button { font:16px sans-serif; padding:14px 32px; border-radius:10px; border:none; background:#4ecf8d; color:#0f1117; cursor:pointer; }
  #startOverlay button.secondary { background:transparent; border:1px solid #4ecf8d; color:#4ecf8d; }

  /* 对话记录面板：左上角徽章下方，可折叠，窄条不遮挡 Live2D 主体 */
  #historyPanel { position:fixed; top:56px; left:12px; z-index:300; width:280px;
    background:rgba(20,23,32,.72); border:1px solid #2a2d3a; border-radius:12px;
    color:#e6e8f0; font:13px sans-serif; backdrop-filter:blur(4px); overflow:hidden; }
  #historyToggle { width:100%; padding:8px 12px; background:transparent; border:none;
    color:#e6e8f0; font:13px sans-serif; cursor:pointer; text-align:left; }
  #historyToggle:hover { background:rgba(40,44,58,.85); }
  #historyBody { padding:0 10px 10px; display:none; }
  #newChatBtn { width:100%; padding:8px; margin-bottom:8px; border-radius:8px; cursor:pointer;
    border:1px solid #4ecf8d; background:transparent; color:#4ecf8d; font:13px sans-serif; }
  #newChatBtn:hover { background:rgba(78,207,141,.12); }
  .sessionRow { padding:7px 8px; border-radius:6px; cursor:pointer; color:#c9cddb; }
  .sessionRow:hover { background:rgba(40,44,58,.85); }
  .sessionRow .meta { color:#8b8fa3; font-size:12px; }
  #sessionList { max-height:40vh; overflow-y:auto; }
  #sessionMsgs { max-height:40vh; overflow-y:auto; margin:8px 0; padding:8px;
    background:rgba(15,17,23,.6); border-radius:8px; font-size:12px; line-height:1.6;
    color:#c9cddb; word-break:break-word; }
  #sessionMsgs .who { color:#8b8fa3; }
  #resumeBtn, #backToListBtn { padding:6px 12px; border-radius:8px; border:none;
    cursor:pointer; font:13px sans-serif; }
  #resumeBtn { background:#4ecf8d; color:#0f1117; }
  #backToListBtn { background:transparent; color:#8b8fa3; }

  /* 移动端适配 */
  @media (max-width: 600px) {
    #info { bottom:8px; max-width:94vw; font-size:12px; gap:8px; flex-wrap:wrap; justify-content:center; }
    #status { max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #subtitle { font-size:14px; bottom:44px; width:92vw; }
    #tutorBadge { top:8px; left:8px; padding:4px 10px; font-size:12px; }
    #tutorBadge .emoji { font-size:16px; }
    #localCam, #camera { width:26vw !important; max-width:120px; top:48px; right:8px; }
    #settingsBtn { top:8px; right:8px; width:32px; height:32px; font-size:15px; }
    #startOverlay button { font-size:18px; padding:18px 44px; }
    #historyPanel { top:48px; left:8px; width:min(72vw, 280px); }
  }
</style>
</head>
<body>
<div id="tutorBadge"><span class="emoji" id="tutorEmoji">👩‍🏫</span><span class="name" id="tutorName">…</span></div>
<div id="historyPanel">
  <button id="historyToggle">💬 对话记录 ▾</button>
  <div id="historyBody">
    <button id="newChatBtn">🆕 新对话</button>
    <div id="sessionListWrap"><div id="sessionList"></div></div>
    <div id="sessionDetail" style="display:none">
      <div id="sessionMsgs"></div>
      <button id="resumeBtn">▶️ 接着聊</button>
      <button id="backToListBtn">← 返回</button>
    </div>
  </div>
</div>
<a id="settingsBtn" href="/dashboard" target="_blank" rel="noopener" title="设置 / Dashboard">⚙️</a>
<img id="camera">
<video id="localCam" autoplay muted playsinline
       style="position:fixed;top:56px;right:12px;width:160px;border-radius:8px;border:2px solid #2a2d3a;opacity:0.85;z-index:100;display:none;"></video>
<audio id="remoteAudio" autoplay></audio>
<div id="startOverlay">
  <button id="startBtn">🎤 进入对话</button>
  <button id="previewBtn" class="secondary" style="display:none">👀 仅预览（无需麦克风/摄像头）</button>
</div>
<div id="subtitle"></div>
<div id="info">
  <span class="dot off" id="connDot"></span>
  <span id="status">Loading...</span>
  <span>👄<span id="mouthVal">0</span></span>
  <span id="userBadge">👤 …</span>
</div>

<script src="live2d/core/live2dcubismcore.min.js"></script>
<script type="module" src="live2d/bundle.js"></script>
<script>
// Live2D SDK 的已知无害报错：页面离开/从 bfcache 恢复时，渲染循环的
// 残留帧回调会访问已释放的实例（_subdelegates is null）。发生在卸载
// 瞬间，不影响功能。源码已在 live2d-src/lappdelegate.ts 修复，
// bundle.js 下次重建后此屏蔽可移除。
window.addEventListener('error', (e) => {
  if (e.filename && e.filename.includes('live2d/bundle.js') &&
      e.message && e.message.includes('_subdelegates')) {
    e.preventDefault();
  }
});

const DEVICE_MODE = new URLSearchParams(location.search).get('device') === '1';
const RTC_TOKEN = new URLSearchParams(location.search).get('token') || '';

// ── 用户标识：URL ?user= > localStorage > 手动输入（多用户并发练习） ──
const USER_ID_RE = /^[A-Za-z0-9_-]{1,32}$/;
function resolveUserId() {
  const fromUrl = new URLSearchParams(location.search).get('user') || '';
  if (USER_ID_RE.test(fromUrl)) return fromUrl;
  const saved = localStorage.getItem('tutor_user_id') || '';
  if (USER_ID_RE.test(saved)) return saved;
  let uid = '';
  while (!USER_ID_RE.test(uid)) {
    uid = (prompt('请输入用户名（1-32 位字母/数字/_/-）:', saved || '') || '').trim();
  }
  return uid;
}
const USER_ID = resolveUserId();
localStorage.setItem('tutor_user_id', USER_ID);
document.getElementById('userBadge').textContent = '👤 ' + USER_ID;

// ── 当前导师：标题 + 左上角徽章（轮询以感知热切换） ──
let currentTutor = null;
async function refreshTutor() {
  try {
    const r = await fetch('/api/tutor/active');
    if (!r.ok) return;
    const t = await r.json();
    if (currentTutor && currentTutor.id === t.id) return;
    currentTutor = t;
    document.title = t.name + ' — English Tutor';
    document.getElementById('tutorEmoji').textContent = t.emoji;
    const nameEl = document.getElementById('tutorName');
    nameEl.textContent = t.name;
    document.getElementById('tutorBadge').title = t.description_cn || '';
  } catch (e) { /* 网络抖动时下轮再试 */ }
}
refreshTutor();
setInterval(refreshTutor, 5000);

// ── 连接状态：合并为一个指示灯（设备模式需 WS + RTC 都连通） ──
let wsOk = false;
let rtcOk = !DEVICE_MODE;
function renderConn() {
  const ok = wsOk && rtcOk;
  document.getElementById('connDot').className = 'dot ' + (ok ? 'on' : 'off');
}

(function connectWS() {
  const p = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const ws = new WebSocket(p + location.host + '/ws/emma/face?user=' + encodeURIComponent(USER_ID));
  ws.onopen = () => {
    wsOk = true; renderConn();
    document.getElementById('status').textContent = '🟢 Live';
  };
  ws.onmessage = (ev) => {
    const d = JSON.parse(ev.data);
    if (d.mouth_open !== undefined) {
      window._setMouthOpen?.(d.mouth_open, d.viseme);
      // 只在新字幕到达时更新；无字幕时保留上一条，避免闪烁
      if (d.transcript) {
        const s = document.getElementById('subtitle');
        s.textContent = d.transcript;
        s.style.opacity = 1;
      }
      document.getElementById('mouthVal').textContent = d.mouth_open.toFixed(2);
    }
    // Device mode shows its own local camera; skip the relayed JPEG.
    if (d.camera_frame && !DEVICE_MODE) {
      const cam = document.getElementById('camera');
      cam.src = 'data:image/jpeg;base64,' + d.camera_frame;
      cam.style.display = 'block';
    }
  };
  ws.onclose = () => { wsOk = false; renderConn(); setTimeout(connectWS, 2000); };
  ws.onerror = () => ws.close();
})();

// ── Device mode: this browser IS the mic/camera/speaker (WebRTC) ──
// 会话模式：{fresh:true} 新开对话 / {resume_from:"会话ID"} 接着某条历史
// 对话聊 / {fresh:false} 续上次（默认）；也可用 URL ?fresh=1 指定。
// 自动重连不传参，保持上次选择。
window._startOpts = { fresh: new URLSearchParams(location.search).get('fresh') === '1',
                      resume_from: '' };
async function startDevice(opts) {
  if (opts) window._startOpts = { fresh: !!opts.fresh, resume_from: opts.resume_from || '' };
  document.getElementById('startOverlay').style.display = 'none';
  const statusEl = document.getElementById('status');

  // 重连入口：先关掉上一路 peer，避免浏览器侧旧连接泄漏
  if (window._rtcPC) {
    try { window._rtcPC.close(); } catch (e) {}
    window._rtcPC = null;
  }

  // 音频处理开关从服务端读取（dashboard 可配）：
  // AGC 会放大噪音底破坏服务端 RMS VAD；noiseSuppression 会把小声语音当噪音吃掉；
  // AEC 保留以防外放场景回采
  let audioProc = { echoCancellation: true, noiseSuppression: false, autoGainControl: false };
  try {
    const r = await fetch('/api/device/audio-settings');
    if (r.ok) audioProc = { ...audioProc, ...(await r.json()) };
  } catch (e) { /* 拉取失败用默认 */ }
  const audioConstraints = { ...audioProc, channelCount: 1 };
  let stream;
  let hasCamera = true;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: audioConstraints,
      video: { width: 1280, height: 720 },
    });
  } catch (e) {
    // 摄像头拿不到就降级为纯语音——对话只需要麦克风；
    // 连麦克风也没有时才退回仅预览
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: audioConstraints, video: false,
      });
      hasCamera = false;
      statusEl.textContent = '🎤 纯语音模式（未检测到摄像头）';
    } catch (e2) {
      statusEl.textContent = '⚠️ 无法访问麦克风/摄像头: ' + e2.message;
      // 无硬件设备给个出口：可进仅预览模式看 Live2D 和字幕
      document.getElementById('previewBtn').style.display = 'block';
      document.getElementById('startOverlay').style.display = 'flex';
      return;
    }
  }
  if (hasCamera) {
    const localCam = document.getElementById('localCam');
    localCam.srcObject = stream;
    localCam.style.display = 'block';
  }

  // LAN 下服务端未配 TURN 时返回空 iceServers，等价于之前的无参构造；
  // 公网/CGNAT 下（手机蜂窝）必须靠这里拿到 STUN/TURN 才能打通
  let rtcCfg = {};
  try {
    const h = RTC_TOKEN ? { 'Authorization': 'Bearer ' + RTC_TOKEN } : {};
    const r = await fetch('/rtc/config', { headers: h });
    if (r.ok) rtcCfg = await r.json();
  } catch (e) { /* 配置拉取失败按 LAN 模式继续 */ }
  const pc = new RTCPeerConnection(rtcCfg);
  window._rtcPC = pc;                   // exposed for diagnostics/e2e tests
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = (ev) => {
    if (ev.track.kind === 'audio') {
      document.getElementById('remoteAudio').srcObject = ev.streams[0];
    }
  };
  pc.onconnectionstatechange = () => {
    rtcOk = pc.connectionState === 'connected';
    renderConn();
    if (pc.connectionState === 'failed') {
      // failed = 连接真的死了，整体重连
      statusEl.textContent = '🔄 RTC 断开，重连中...';
      setTimeout(() => startDevice(), 2000);
    } else if (pc.connectionState === 'disconnected') {
      // disconnected 多为网络抖动的瞬态，ICE 大概率自行恢复——
      // 不要急着拆连接重连（重连会中断正在进行的对话）
      statusEl.textContent = '⏳ 网络抖动，等待恢复...';
    }
  };

  statusEl.textContent = '🔌 连接中...';
  await pc.setLocalDescription(await pc.createOffer());
  // server does not trickle — gather first. 但必须有超时兜底：
  // 配了 TURN 而中继不可达/过慢时，gathering 可能永远不 complete，
  // 表现为"点击开始没反应"。LAN 下 host candidate 已够用，先到先发。
  await new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 4000);
    pc.addEventListener('icegatheringstatechange', () => {
      if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); }
    });
  });

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (RTC_TOKEN) headers['Authorization'] = 'Bearer ' + RTC_TOKEN;
    const resp = await fetch('/rtc/offer', {
      method: 'POST', headers,
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type,
                             user_id: USER_ID, fresh: !!window._startOpts.fresh,
                             resume_from: window._startOpts.resume_from || '' }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    await pc.setRemoteDescription(await resp.json());
    statusEl.textContent = '🟢 设备已连接';
  } catch (e) {
    statusEl.textContent = '⚠️ 信令失败: ' + e.message;
    setTimeout(() => startDevice(), 3000);
  }
}

if (DEVICE_MODE) {
  document.getElementById('startOverlay').style.display = 'flex';
  document.getElementById('status').textContent = '设备模式';
  document.getElementById('startBtn').onclick = () => startDevice({ fresh: false });
  document.getElementById('previewBtn').onclick = () => {
    document.getElementById('startOverlay').style.display = 'none';
    document.getElementById('status').textContent = '👀 仅预览模式';
  };
}

// ── 对话记录面板：新对话 / 历史列表 / 接着聊（与连接状态无关，随时可看） ──
(function initHistoryPanel() {
  const toggle = document.getElementById('historyToggle');
  const body = document.getElementById('historyBody');
  const listWrap = document.getElementById('sessionListWrap');
  const listEl = document.getElementById('sessionList');
  const detail = document.getElementById('sessionDetail');
  const msgsEl = document.getElementById('sessionMsgs');
  let open = false;
  let currentSessionId = '';

  toggle.onclick = () => {
    open = !open;
    body.style.display = open ? 'block' : 'none';
    toggle.textContent = open ? '💬 对话记录 ▴' : '💬 对话记录 ▾';
    if (open) loadList();
  };

  document.getElementById('newChatBtn').onclick = () => startDevice({ fresh: true });
  document.getElementById('resumeBtn').onclick = () => {
    if (currentSessionId) startDevice({ resume_from: currentSessionId });
  };
  document.getElementById('backToListBtn').onclick = () => {
    detail.style.display = 'none';
    listWrap.style.display = 'block';
  };

  async function loadList() {
    listEl.textContent = '加载中…';
    try {
      const r = await fetch('/api/sessions?user=' + encodeURIComponent(USER_ID));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const sessions = (await r.json()).sessions || [];
      if (!sessions.length) { listEl.textContent = '还没有历史对话'; return; }
      listEl.innerHTML = '';
      for (const s of sessions) {
        const row = document.createElement('div');
        row.className = 'sessionRow';
        const date = (s.date || '').replace('T', ' ').slice(0, 16);
        row.innerHTML = '<div>' + escapeHtml(date || s.id) + '</div>' +
          '<div class="meta">' + s.message_count + ' 条消息 · ' +
          s.word_count + ' 词</div>';
        row.onclick = () => loadDetail(s.id);
        listEl.appendChild(row);
      }
    } catch (e) {
      listEl.textContent = '加载失败: ' + e.message;
    }
  }

  async function loadDetail(id) {
    currentSessionId = id;
    try {
      const r = await fetch('/api/sessions/' + encodeURIComponent(id) +
                            '?user=' + encodeURIComponent(USER_ID));
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const messages = (await r.json()).messages || [];
      msgsEl.innerHTML = '';
      for (const m of messages) {
        const div = document.createElement('div');
        const who = m.role === 'assistant' ? '导师' : '学员';
        div.innerHTML = '<span class="who">' + who + ':</span> ' +
          escapeHtml(m.content || '');
        msgsEl.appendChild(div);
      }
      listWrap.style.display = 'none';
      detail.style.display = 'block';
      msgsEl.scrollTop = msgsEl.scrollHeight;
    } catch (e) { /* 拉取失败留在列表页，下条再试 */ }
  }

  function escapeHtml(t) {
    return String(t).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
})();
</script>
</body>
</html>
