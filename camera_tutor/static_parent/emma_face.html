<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emma — Animated Face</title>
<style>
  body { margin:0; background:#0f1117; color:#e4e6ef; font-family:sans-serif; display:flex; height:100vh; align-items:center; justify-content:center; }
  .container { display:flex; flex-direction:column; align-items:center; gap:12px; }
  canvas { width:360px; height:360px; border-radius:50%; background:linear-gradient(135deg,#1a1d27,#242836); }
  .param { display:flex; gap:16px; font-size:13px; color:#8b8fa3; }
  .status { font-size:14px; color:#8b8fa3; min-height:20px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; margin:0 2px; background:#1a1d27; border:1px solid #2a2d3a; }
  .badge.high { border-color:#ff5c6c; color:#ff5c6c; }
</style>
</head>
<body>
<div class="container">
  <canvas id="face" width="360" height="360"></canvas>
  <div class="param">
    <span>👄 <span id="mouthVal">0.0</span></span>
    <span>👅 <span id="tongueVal">0.0</span></span>
    <span id="visemeLabel" class="badge">sil</span>
  </div>
  <div class="status" id="status">Waiting for Emma...</div>
</div>

<script>
const canvas = document.getElementById('face');
const ctx = canvas.getContext('2d');
const W = 360, H = 360;

// ── Smooth state ──
let current = { mouthOpen: 0, mouthWidth: 0.3, tongue: 0, lipBite: 0 };
let target  = { mouthOpen: 0, mouthWidth: 0.3, tongue: 0, lipBite: 0 };

function lerp(a, b, t) { return a + (b - a) * t; }

function renderFace() {
  // Smooth interpolation (60fps feel)
  current.mouthOpen   = lerp(current.mouthOpen, target.mouthOpen, 0.3);
  current.mouthWidth  = lerp(current.mouthWidth, target.mouthWidth, 0.3);
  current.tongue      = lerp(current.tongue, target.tongue, 0.3);
  current.lipBite     = lerp(current.lipBite, target.lipBite, 0.3);

  ctx.clearRect(0, 0, W, H);
  const cx = 180, cy = 170, r = 65;

  // Face
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r*1.15, 0, 0, Math.PI*2);
  const grad = ctx.createRadialGradient(cx-r*0.3, cy-r*0.3, 0, cx, cy, r);
  grad.addColorStop(0, '#ffe8d0'); grad.addColorStop(1, '#f0c8a0');
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#e0b890'; ctx.lineWidth = 2; ctx.stroke();

  // Blush
  ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.ellipse(cx-r*0.45, cy+r*0.3, r*0.18, r*0.1, 0, 0, Math.PI*2); ctx.fillStyle = '#ffcccc'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+r*0.45, cy+r*0.3, r*0.18, r*0.1, 0, 0, Math.PI*2); ctx.fillStyle = '#ffcccc'; ctx.fill();
  ctx.globalAlpha = 1;

  // Eyes
  const blink = current.mouthOpen < 0.01 ? 0.3 : 0.12;
  for (let side of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(cx+side*r*0.32, cy-r*0.2, r*0.1, r*blink, 0, 0, Math.PI*2);
    ctx.fillStyle = '#554433'; ctx.fill();
    // Highlight
    ctx.beginPath(); ctx.ellipse(cx+side*r*0.34, cy-r*0.22, r*0.03, r*0.02, 0, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
  }

  // Eyebrows
  for (let side of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(cx+side*r*0.42, cy-r*0.48);
    ctx.quadraticCurveTo(cx+side*r*0.32, cy-r*0.52, cx+side*r*0.2, cy-r*0.46);
    ctx.strokeStyle = '#8b6b4a'; ctx.lineWidth = 2.5; ctx.stroke();
  }

  // Nose
  ctx.beginPath(); ctx.ellipse(cx, cy+r*0.05, r*0.05, r*0.04, 0, 0, Math.PI*2);
  ctx.fillStyle = '#e8c8a8'; ctx.fill();

  // ── Mouth ──
  const m  = current.mouthOpen;   // 0-1
  const mw = current.mouthWidth;  // 0-1
  const tx = cx, ty = cy + r*0.45;
  const mh = m * r * 0.55;       // mouth height
  const mW = r * (0.4 + mw * 0.25); // mouth width

  // Tongue (if visible)
  if (current.tongue > 0.3) {
    ctx.beginPath(); 
    ctx.ellipse(tx, ty + mh * 0.15 + current.tongue * r * 0.08, 
                r * 0.12, r * 0.06 + current.tongue * r * 0.04, 0, 0, Math.PI*2);
    ctx.fillStyle = '#ff9999'; ctx.fill();
  }

  // Lower lip
  if (current.lipBite > 0.5) {
    // Lip bite: upper teeth on lower lip (F/V)
    ctx.beginPath(); ctx.moveTo(tx - mW, ty);
    ctx.quadraticCurveTo(tx - mW * 0.3, ty + mh * 0.2, tx, ty + mh * 0.1);
    ctx.quadraticCurveTo(tx + mW * 0.3, ty + mh * 0.2, tx + mW, ty);
    ctx.fillStyle = '#cc7766'; ctx.fill();
  } else {
    // Normal mouth
    ctx.beginPath(); ctx.moveTo(tx - mW, ty);
    ctx.quadraticCurveTo(tx, ty + mh + r*0.02, tx + mW, ty);
    ctx.fillStyle = '#cc7766'; ctx.fill();
    ctx.strokeStyle = '#bb6655'; ctx.lineWidth = 2; ctx.stroke();
  }

  requestAnimationFrame(renderFace);
}

// Start rendering
renderFace();

// ── WebSocket ──
let ws = null;
function connectWS() {
  const p = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(p + location.host + '/ws/emma/face');
  ws.onmessage = function(event) {
    const d = JSON.parse(event.data);
    if (d.mouth_open !== undefined) {
      target.mouthOpen   = d.mouth_open;
      target.tongue      = d.tongue_visible || 0;
      target.lipBite     = d.viseme === 'fv' ? 0.95 : 0;
      target.mouthWidth  = d.mouth_open > 0.5 ? 0.7 : 0.3;
      document.getElementById('status').textContent = d.transcript ? '💬 ' + d.transcript : '🟢 Live';
      document.getElementById('mouthVal').textContent = d.mouth_open.toFixed(2);
      document.getElementById('tongueVal').textContent = (d.tongue_visible||0).toFixed(2);
      document.getElementById('visemeLabel').textContent = d.viseme || '';
      document.getElementById('visemeLabel').className = 'badge' + ((d.viseme === 'th' || d.viseme === 'fv') ? ' high' : '');
    }
  };
  ws.onclose = function() { setTimeout(connectWS, 2000); };
}
connectWS();
</script>
</body>
</html>
